<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Henry Oladipupo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <a href="index.html" class="logo">Henry Oladipupo</a>
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
      <ul id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="planner.html">Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Me</h1>

    <section class="card">
      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name">
          <span class="error" id="nameError"></span>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email">
          <span class="error" id="emailError"></span>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone">
          <span class="error" id="phoneError"></span>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>
          <span class="error" id="messageError"></span>
        </div>
        <button type="submit" class="btn">Send Message</button>
        <p id="formMessage" class="message"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Henry Oladipupo &middot; 2025/C/CSC/1099 &middot; COS 106 Term Project</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
