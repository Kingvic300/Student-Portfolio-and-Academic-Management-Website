<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Planner | Henry Oladipupo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <a href="index.html" class="logo">Henry Oladipupo</a>
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
      <ul id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>

        <li><a href="planner.html">Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Academic Planner</h1>

    <section class="card">
      <p>Add your tasks below. Tick a task to mark it as completed, or delete it when you no longer need it.</p>

      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="Enter a new task, e.g. Revise MTH 101" aria-label="New task">
        <button type="submit" class="btn">Add Task</button>
      </form>
      <p id="taskError" class="error"></p>

      <p id="taskCount">0 of 0 tasks completed</p>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Henry Oladipupo &middot; 2025/C/CSC/1099 &middot; COS 106 Term Project</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/planner.js"></script>
</body>
</html>
